<title>単語テスト</title>
<style>
  :root {
    --bg: #faf6ee; --surface: #ffffff; --surface-2: #f3ede0;
    --border: #e7ddc9; --border-strong: #d9cbac;
    --text: #2a2620; --text-muted: #8a8171;
    --accent: #b5762f; --accent-strong: #8f5a1f;
    --ok: #3f7d4f; --ok-bg: #e7f3e9;
    --ng: #b23a2e; --ng-bg: #f6e4e0;
    --radius: 14px; --radius-sm: 9px;
    --font-body: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif;
    --font-mono: 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a16; --surface: #262319; --surface-2: #2f2b20;
      --border: #423c2c; --border-strong: #574f38;
      --text: #eee6d6; --text-muted: #a99f89;
      --accent: #e0a35c; --accent-strong: #f0b876;
      --ok: #7fcf94; --ok-bg: #1e332356;
      --ng: #e2897c; --ng-bg: #3a201c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  body { padding: 18px 14px 60px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--text-muted); }
  h1 { font-size: 21px; margin: 4px 0 18px; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  a { color: inherit; }

  .set-card {
    display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; cursor: pointer;
  }
  .set-card:hover { border-color: var(--accent); }
  .set-name { font-size: 17px; font-weight: 700; color: var(--text); }
  .set-meta { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
  .set-progress-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .bar-track { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .bar-num { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent-strong); font-weight: 700; white-space: nowrap; }

  .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-muted); text-decoration: none; margin-bottom: 12px; }
  .back-link:hover { color: var(--accent); }

  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
  .stat-box { flex: 1; min-width: 90px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; text-align: center; }
  .stat-num { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--accent-strong); }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .threshold-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px;
  }
  .threshold-select {
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    padding: 6px 8px; border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text); cursor: pointer;
  }

  .primary-btn {
    display: block; width: 100%; text-align: center; font-size: 15px; font-weight: 700;
    padding: 15px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: #fff;
    cursor: pointer; touch-action: manipulation; margin: 14px 0;
  }
  .primary-btn:disabled { opacity: 0.4; cursor: default; }
  .secondary-btn {
    display: inline-block; font-size: 13.5px; font-weight: 600; padding: 10px 16px;
    border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text); cursor: pointer; touch-action: manipulation;
  }
  .secondary-btn:disabled { opacity: 0.4; cursor: default; }
  .danger-btn { border-color: var(--ng); color: var(--ng); }
  .danger-btn:hover { background: var(--ng-bg); }
  .mini-btn {
    font-family: var(--font-body); font-size: 11px; font-weight: 600; padding: 4px 9px;
    border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text-muted); cursor: pointer; touch-action: manipulation; white-space: nowrap;
  }
  .mini-btn:hover { border-color: var(--ok); color: var(--ok); }

  details.word-acc { margin-bottom: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  details.word-acc summary { padding: 9px 12px; font-size: 13px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.word-acc summary::-webkit-details-marker { display: none; }
  .lesson-progress { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); font-weight: 400; }
  .lesson-acc-actions { display: flex; gap: 8px; padding: 8px 12px; flex-wrap: wrap; border-top: 1px solid var(--border); }
  .word-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .word-table td { padding: 5px 8px; border-top: 1px solid var(--border); vertical-align: middle; }
  .word-table td.wt-en { font-weight: 700; }
  .word-table td.wt-count { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
  .word-table td.wt-action { text-align: right; white-space: nowrap; width: 1%; }
  .mastered-badge { color: var(--ok); font-weight: 700; }

  .test-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 22px; text-align: center; min-height: 260px; display: flex; flex-direction: column; justify-content: center; }
  .test-progress { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .test-word { font-size: 30px; font-weight: 800; word-break: break-word; }
  .test-pos { display: inline-block; font-size: 11px; color: #fff; background: var(--accent); border-radius: 4px; padding: 2px 7px; margin-top: 8px; }
  .test-ipa { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); margin-top: 6px; }
  .test-pron { font-size: 12px; color: var(--text-muted); }
  .test-answer { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--border-strong); }
  .test-meaning { font-size: 21px; font-weight: 700; color: var(--ng); }
  .test-booster { font-size: 12.5px; color: var(--text-muted); margin-top: 8px; line-height: 1.6; text-align: left; }
  .reveal-btn { margin-top: 20px; }
  .judge-row { display: flex; gap: 10px; margin-top: 18px; }
  .judge-btn { flex: 1; padding: 15px; border-radius: var(--radius-sm); border: none; font-size: 14.5px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
  .judge-ng { background: var(--ng-bg); color: var(--ng); }
  .judge-ok { background: var(--ok-bg); color: var(--ok); }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 20px; text-align: center; }
  .result-title { font-size: 18px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 20px; margin: 16px 0; }
  .result-num { font-family: var(--font-mono); font-size: 26px; font-weight: 800; color: var(--accent-strong); }
  .result-label { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

  .sync-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 14px; font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); margin-right: 6px; }
  .sync-dot.on { background: var(--ok); }
  .sync-btn { font-size: 12px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; }
  .sync-input { font-family: var(--font-mono); font-size: 13px; text-transform: uppercase; width: 100px; padding: 6px 7px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); }

  .account-gate { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px 16px; }
  .account-gate h1 { margin: 6px 0 4px; }
  .account-gate p { color: var(--text-muted); font-size: 13.5px; margin-bottom: 22px; }
  .account-list { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
  .account-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 18px; font-size: 16px; font-weight: 700; cursor: pointer; text-align: left; }
  .account-item:hover { border-color: var(--accent); }
  .account-add-row { display: flex; gap: 8px; margin-top: 18px; width: 100%; max-width: 320px; }
  .account-add-row input { flex: 1; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font-size: 14px; }
  .account-add-row button { padding: 0 16px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
  .account-badge { cursor: pointer; }

  footer { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 30px; }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  // ===== データ（ビルド時にNode.jsで実データを注入） =====
  var SETS = {
    polaris: { id: 'polaris', name: '__POLARIS_NAME__', lessons: /*POLARIS_DATA*/[{"number":1,"title":"運動の「やる気スイッチ」は意外な場所にある","words":[{"word":"sedentary","pos":"形","pronunciation":"セデンタリー","ipa":"sédəntèri","meaning":"座りがちな","booster":"ラテン語sedere(座る)が語源。sit(座る)と同じ根っこを持ち、seat(座席)やsession(会議=座っている時間)とも仲間。"},{"word":"microbiome","pos":"名","pronunciation":"マイクロバイオーム","ipa":"màikroubáioum","meaning":"微生物叢","booster":"micro(微小)+biome(生物群系)の合成語。bio-はbiology・biographyと同じ「命・生命」を表す語根で、体内に棲む微生物の集合体をイメージ。"},{"word":"endurance","pos":"名","pronunciation":"インデュランス","ipa":"indjúərəns","meaning":"持久力","booster":"ラテン語durare(持続する)由来。durable(耐久性のある)と同語根で、endure(耐え忍ぶ)に名詞語尾-anceがついた形。"},{"word":"voluntary","pos":"形","pronunciation":"ヴォランタリー","ipa":"váləntèri","meaning":"自発的な","booster":"ラテン語voluntas(意志)が語源。volunteer(ボランティア=自分の意志で動く人)と兄弟語で、「自分の意志で」という核イメージが共通。"},{"word":"irreversibly","pos":"副","pronunciation":"イリバーシブリー","ipa":"ìrivə́ːrsəbli","meaning":"不可逆的に","booster":"ir-(否定)+reverse(逆にする、ラテン語vertere=向きを変える)+-ibly。「元の向きに戻せないほどに」というイメージで覚える。"},{"word":"coronary","pos":"形","pronunciation":"コロナリー","ipa":"kɔ́ːrənèri","meaning":"冠状動脈の","booster":"ラテン語corona(王冠)が語源。心臓を王冠のように取り巻く血管を指す言葉で、crown(王冠)やcoronation(戴冠式)と同じ根を持つ。"},{"word":"dwell","pos":"動","pronunciation":"ドゥエル","ipa":"dwel","meaning":"住む、とどまる","booster":"古英語dwellan(迷う・とどまる)が語源。dwelling(住居)、dweller(住民)と同根で、本文では腸内に「棲みつく」細菌を指す。"},{"word":"transplanted","pos":"動","pronunciation":"トランスプランティッド","ipa":"trænsplǽntid","meaning":"移植された","booster":"trans-(向こうへ)+plant(植える)。原義は「別の場所へ植え替える」で、臓器移植のtransplantも同じ語根から来ている。"},{"word":"neurotransmitter","pos":"名","pronunciation":"ニューロトランスミッター","ipa":"njùːroutrænsmítər","meaning":"神経伝達物質","booster":"neuro-(神経、ギリシャ語neuron)+transmit(送る、trans-越えて+mittere送る)+-er。神経細胞から細胞へ情報を運ぶ「送り届け役」の物質というイメージ。"},{"word":"premature","pos":"形","pronunciation":"プリマチュア","ipa":"prìːmətʃúər","meaning":"早すぎる、時期尚早の","booster":"pre-(前に)+mature(成熟した、ラテン語maturus)。「成熟する前の」が直訳で、本文のpremature deaths(早すぎる死)のように「本来の時期より早い」ことを表す。"},{"word":"inherited","pos":"形","pronunciation":"インヘリティッド","ipa":"inhéritid","meaning":"遺伝性の、受け継がれた","booster":"heritage(遺産)やheir(相続人)と同語源。ラテン語hereditareが元で、「親から受け継いだ」性質を指し、本文ではinherited traits(遺伝形質)として登場。"},{"word":"conversely","pos":"副","pronunciation":"コンバースリー","ipa":"kənvə́ːrsli","meaning":"逆に、それとは対照的に","booster":"converse(逆の、con-共に+vertere向きを変える)+-ly。universe(全てが一つに向かう)やreverse(逆にする)と同じvert-語根の仲間で「向きが反転する」イメージ。"},{"word":"inclined","pos":"形","pronunciation":"インクラインド","ipa":"inkláind","meaning":"傾向がある、〜したい気持ちがある","booster":"ラテン語clinare(傾く)が語源で、incline(傾ける)+-ed。心がある方向に「傾く」イメージから「〜する気になる」を表し、decline(下に傾く=断る)やclimate(気候)とも同語源。"},{"word":"trigger","pos":"動","pronunciation":"トリガー","ipa":"trígər","meaning":"引き起こす、誘発する","booster":"もとは銃の「引き金」を指す名詞。引き金を引くと連鎖的に発砲が起こることから、「ある出来事のきっかけを作る」という動詞の意味に発展した。"},{"word":"substantially","pos":"副","pronunciation":"サブスタンシャリー","ipa":"səbstǽnʃəli","meaning":"かなり、相当に","booster":"substance(実質、ラテン語substare=下に立つ)+-ial+-ly。「実質を伴うほどの量」というイメージで、「かなりの程度」を表す。"},{"word":"counterpart","pos":"名","pronunciation":"カウンターパート","ipa":"káuntərpὰːrt","meaning":"対応するもの、相当するもの","booster":"counter-(対応して)+part(部分)。「向かい合う部分」が原義で、本文では活発なマウスに「対応する」活発でない個体を指す。"},{"word":"deplete","pos":"動","pronunciation":"ディプリート","ipa":"diplíːt","meaning":"枯渇させる、使い果たす","booster":"de-(完全に)+plere(満たす、ラテン語)。complete(完全に満たす)やsupply(補給)と同語根で、「満ちていたものを空にする」がコアイメージ。"},{"word":"sustain","pos":"動","pronunciation":"サステイン","ipa":"səstéin","meaning":"持続させる、支える","booster":"sus-(下から)+tenere(保つ、ラテン語)。sustainable(持続可能な)と同語源で、「下から支え続ける」イメージ。"},{"word":"trait","pos":"名","pronunciation":"トレイト","ipa":"treit","meaning":"形質、特徴","booster":"フランス語trait(引かれた線)が語源。ラテン語trahere(引く)から来ており、tractor(トラクター=引っ張る機械)と同根で「引き出された一本の特徴」というイメージ。"},{"word":"influence","pos":"動","pronunciation":"インフルエンス","ipa":"ínfluəns","meaning":"影響を与える","booster":"in-(中へ)+fluere(流れる、ラテン語)。fluid(流動体)と同語根で、「見えない力が流れ込んで作用する」イメージ。"},{"word":"diabetes","pos":"名","pronunciation":"ダイアビーティーズ","ipa":"dàiəbíːtiːz","meaning":"糖尿病","booster":"ギリシャ語diabainein(通り抜ける)が語源。過剰な尿の排出という古代の症状観察から名付けられた。"},{"word":"genetically","pos":"副","pronunciation":"ジェネティカリー","ipa":"dʒənétikəli","meaning":"遺伝的に","booster":"gene(遺伝子)+-tic+-ally。genome・geneticsと同根。"},{"word":"unbiased","pos":"形","pronunciation":"アンバイアスト","ipa":"ʌ̀nbáiəst","meaning":"偏りのない","booster":"un-(否定)+bias(偏り、フランス語biais=斜め)+-ed。"},{"word":"variability","pos":"名","pronunciation":"ヴェアリアビリティ","ipa":"vὲəriəbíləti","meaning":"変動性、多様性","booster":"vary(変わる)+-ability。variable(変数)と同根。"},{"word":"evolutionary","pos":"形","pronunciation":"エヴォルーショナリー","ipa":"èvəlúːʃənèri","meaning":"進化の","booster":"evolve(進化する、e-外へ+volvere巻く)+-tionary。"},{"word":"breed","pos":"動","pronunciation":"ブリード","ipa":"bríːd","meaning":"品種改良する、繁殖させる","booster":"古英語bredan(温める、育てる)が語源。本文ではbred(過去分詞)の形で登場。"},{"word":"antibiotic","pos":"名","pronunciation":"アンティバイオティック","ipa":"æ̀ntibaiάtik","meaning":"抗生物質","booster":"anti-(反)+bio(命、ギリシャ語)+-tic。「細菌の命に反する物質」が原義。"},{"word":"genome","pos":"名","pronunciation":"ジーノウム","ipa":"dʒíːnoum","meaning":"ゲノム、全遺伝情報","booster":"gene(遺伝子)とchromosome(染色体)の混成語。"},{"word":"metabolite","pos":"名","pronunciation":"メタボライト","ipa":"mətǽbəlàit","meaning":"代謝物","booster":"metabolism(代謝)+-ite。ギリシャ語metabole(変化)が語源。"},{"word":"bloodstream","pos":"名","pronunciation":"ブラッドストリーム","ipa":"blʌ́dstrìːm","meaning":"血流","booster":"blood(血)+stream(流れ)。そのまま「血の流れ」。"},{"word":"computational","pos":"形","pronunciation":"コンピュテーショナル","ipa":"kὰmpjutéiʃənəl","meaning":"計算による","booster":"compute(計算する)+-ational。"},{"word":"fundamental","pos":"形","pronunciation":"ファンダメンタル","ipa":"fʌ̀ndəméntl","meaning":"根本的な","booster":"ラテン語fundus(底、基礎)が語源。foundation(基礎)と同根。"},{"word":"capacity","pos":"名","pronunciation":"キャパスィティ","ipa":"kəpǽsəti","meaning":"能力、容量","booster":"ラテン語capax(収容できる)が語源。"},{"word":"pathway","pos":"名","pronunciation":"パスウェイ","ipa":"pǽθwèi","meaning":"経路","booster":"path(道)+way(道)。「道」を重ねた強調表現。"},{"word":"physiology","pos":"名","pronunciation":"フィズィアロジー","ipa":"fìziάlədʒi","meaning":"生理機能、生理学","booster":"phy ning":"相関する","booster":"co-(共に)+relate(関連する)。「お互いに関連し合う」がそのまま「相関する」の意味に。名詞形correlation(相関関係)は統計やデータ分析の話でも頻出する。"},{"word":"longevity","pos":"名","pronunciation":"ロンジェヴィティ","ipa":"lɑndʒévəti","meaning":"継続期間","booster":"long(長い)+ラテン語aevum(年齢・時代)。本来は「長寿」だが、本文のように「(在籍・在職などの)長く続く期間」の意味でも使われる。lifelongやageと語源イメージが繋がる。"},{"word":"paraphrase","pos":"動","pronunciation":"パラフレイズ","ipa":"pǽrəfrèiz","meaning":"言い換える","booster":"para-(そばに・別の形で)+phrase(句、言い回し)。「元の言葉のそばに別の言い方を並べる」がそのまま「言い換える」に。paragraph(段落)も同じpara-を持つ仲間。"},{"word":"ontological","pos":"形","pronunciation":"オントロジカル","ipa":"ὰntəlɑ́dʒikəl","meaning":"存在論的な","booster":"ギリシャ語on(存在するもの)+logy(〜学)からontology(存在論)。「〜である」という存在そのものを扱う哲学分野の形容詞形で、難語だが「存在」の核だけ押さえれば十分。"},{"word":"substantially","pos":"副","pronunciation":"サブスタンシャリー","ipa":"səbstǽnʃəli","meaning":"かなり","booster":"substance(実質・物質)の形容詞substantialに-lyがついた形。sub-(下に)+stance(立つ)で「下から支える実質」が原義。実質を伴うほど大きい、つまり「かなり、相当に」となる。"},{"word":"substitute","pos":"動","pronunciation":"サブスティテュート","ipa":"sʌ́bstətùt","meaning":"代わりを務める、代用する","booster":"sub-(下に)+statuere(置く、ラテン語)。「別のものの下に据えて置き換える」が原義。名詞では「代役、代用品」の意味で、スポーツの「サブ」の語源もここ。"},{"word":"thorough","pos":"形","pronunciation":"サロウ","ipa":"θə́rou","meaning":"徹底的な、綿密な","booster":"throughと同語源で「隅から隅まで通り抜ける」がイメージ。そこから物事を「徹底的に」行う様子を表す形容詞になった。発音がthroughとは違うので要注意。"},{"word":"literacy","pos":"名","pronunciation":"リテラシー","ipa":"lítərəsi","meaning":"読み書き能力、識字力","booster":"ラテン語littera(文字)が語源。literature(文学)、letter(手紙・文字)と同じ仲間で、「文字を扱える能力」が原義。近年は「情報リテラシー」のように応用的な意味でも定着している。"},{"word":"attribute","pos":"動","pronunciation":"アトリビュート","ipa":"ətríbjut","meaning":"〜のせいにする、起因すると考える","booster":"at-(〜に)+tribute(与える、ラテン語tribuere)。「ある結果をある原因に帰する」がイメージ。名詞attribute(属性・特質)としても頻出する多義語。"},{"word":"namely","pos":"副","pronunciation":"ネイムリー","ipa":"néimli","meaning":"すなわち、つまり","booster":"name(名前)+ly。「名前を挙げて言えば」が原義で、具体例を挙げて言い換える際の「すなわち」に。that is to sayとほぼ同義の書き言葉表現。"},{"word":"donor","pos":"名","pronunciation":"ドウナー","ipa":"dóunər","meaning":"寄贈者、提供者","booster":"ラテン語donare(与える)が語源。donate(寄付する)、donation(寄付)と同じ仲間で、「与える人」がそのまま「寄贈者・提供者」の意味になる。"},{"word":"determine","pos":"動","pronunciation":"ディターミン","ipa":"ditə́rmin","meaning":"判断する、決定する","booster":"de-(強調)+terminus(境界、終点)。「境界線をはっきり定める」が原義で、そこから「(事実・意志を)決定する、突き止める」に。terminal(終着駅)と同語源。"},{"word":"variable","pos":"名","pronunciation":"ヴェアリアブル","ipa":"vériəbl","meaning":"変数、変わりうる要因","booster":"vary(変化する)+able(できる)。ラテン語variare(変える)が語源で、variety(多様性)とも仲間。「変わり得るもの」がそのまま数学・統計の「変数」に。"},{"word":"anonymous","pos":"形","pronunciation":"アノニマス","ipa":"ənɑ́nəməs","meaning":"匿名の","booster":"an-(否定)+onym(名前、ギリシャ語onoma)。「名前がない」が直訳で、synonym(同義語)、pseudonym(ペンネーム)と同じonym系ファミリー。"},{"word":"possess","pos":"動","pronunciation":"ポゼス","ipa":"pəzés","meaning":"所有する","booster":"pos-(強調)+sedere(座る、ラテン語)。「しっかり座って動かない=手放さず持っている」がイメージ。名詞possession(所有物)とセットで覚えたい。"},{"word":"transform","pos":"動","pronunciation":"トランスフォーム","ipa":"trænsfɔ́rm","meaning":"変える、変容させる","booster":"trans-(越えて)+form(形)。「元の形を越えて別の形に変える」が直訳で、根本から形が変わるニュアンスを持つ。"},{"word":"realm","pos":"名","pronunciation":"レルム","ipa":"relm","meaning":"領域、世界","booster":"古フランス語reialme(王国)が語源で、royal(王の)と同語源。もとは「王が治める領土」を指したが、比喩的に「〜の世界、領域」も表すようになった。"},{"word":"perception","pos":"名","pronunciation":"パーセプション","ipa":"pərsépʃən","meaning":"認識、知覚","booster":"perceive(知覚する)の名詞形。per-(徹底的に)+cept(掴む)で「隅々まで掴み取ること」が原義。self-perceptionは「自分自身をどう捉えるか」の意味になる。"},{"word":"shrink","pos":"動","pronunciation":"シュリンク","ipa":"ʃriŋk","meaning":"縮小する、減る","booster":"古英語scrincan(縮む)が語源。服が洗濯で「縮む」のも数量が「減る」のも同じshrinkで表現できる。shrinkage(縮小)は名詞形。"},{"word":"ultimately","pos":"副","pronunciation":"アルティメットリー","ipa":"ʌ́ltimətli","meaning":"最終的に","booster":"ultimate(究極の、最後の)+ly。ラテン語ultimus(最後の)が語源で、「あらゆる過程を経た末に」というニュアンスで文全体を修飾する。"},{"word":"subject","pos":"名","pronunciation":"サブジェクト","ipa":"sʌ́bdʒikt","meaning":"被験者","booster":"sub-(下に)+jacere(投げる、ラテン語)。「実験の下に置かれる人」が原義。本文ではresearch subjects(研究対象者)として登場。"},{"word":"sample size","pos":"名","pronunciation":"サンプル サイズ","ipa":"sǽmpl sàiz","meaning":"標本サイズ","booster":"sample(標本)+size(規模)。統計調査の基本用語。"},{"word":"occupation","pos":"名","pronunciation":"アキュペイション","ipa":"ὰkjupéiʃən","meaning":"職業","booster":"occupy(占める)+-ation。「時間を占めるもの」が原義。"}]},{"number":6,"title":"「創造性あふれる人の特徴」","words":[{"word":"novelty","pos":"名","pronunciation":"ノヴェルティ","ipa":"nɑ́vəlti","meaning":"目新しさ","booster":"ラテン語novus(新しい)が語源で、novel(小説/新しい)と同じ仲間。novice(初心者=まだ新しい人)、renovate(改装する=再び新しくする)ともつながる「新しさ」ファミリー。"},{"word":"fruitful","pos":"形","pronunciation":"フルートフル","ipa":"frútfəl","meaning":"実り多い","booster":"fruit(果実)+ful(満ちた)。文字通り「果実がたわわに実った」イメージから「成果の多い」の意味に。逆に実を結ばない「無駄な」はfruitlessで、セットで覚えると効率的。"},{"word":"transferable","pos":"形","pronunciation":"トランスファラブル","ipa":"trænsfə́rəbl","meaning":"応用できる","booster":"trans-(越えて)+fer(運ぶ、ラテン語ferre)+able(できる)。「別の場所へ運べる」が原義で、本文では「ある分野のスキルを別分野へ運べる」→「応用できる」の意味になっている。"},{"word":"improvise","pos":"動","pronunciation":"インプロヴァイズ","ipa":"ímprəvàiz","meaning":"即興で行う","booster":"im-(否定)+provise(前もって見る、provide「備える」と同語源)。「前もって準備しない」が原義で、そこから「即興でやる」に。ジャズの「アドリブ=インプロ」もこの単語から。"},{"word":"camouflage","pos":"名","pronunciation":"カムフラージュ","ipa":"kǽməflɑ̀ʒ","meaning":"擬態","booster":"フランス語camoufler(変装する、目くらましする)が語源で、日本語にも「カムフラージュ」としてそのまま定着している外来語。生物の保護色から軍事の迷彩まで幅広く使われる。"},{"word":"discipline","pos":"名","pronunciation":"ディシプリン","ipa":"dísəplin","meaning":"分野、規律","booster":"ラテン語discere(学ぶ)が語源で、disciple(弟子=学ぶ人)と同じ仲間。「学問の一分野」の意味と「規律・訓練」の意味の両方を持つ多義語。"},{"word":"endeavor","pos":"名","pronunciation":"エンデヴァー","ipa":"endévər","meaning":"試み、努力","booster":"en-(〜にする)+devoir(義務、フランス語)。「義務を果たそうと努める」が原義で、NASAのスペースシャトル「エンデバー号」の名前としても有名。"},{"word":"pursue","pos":"動","pronunciation":"パースー","ipa":"pərsú","meaning":"追求する、従事する","booster":"per-(徹底的に)+sequi(追う、ラテン語)。「どこまでも追いかける」がイメージで、目標や趣味を「追求する」の意味に。sequence(連続)、consequence(結果)と同語源。"},{"word":"persistently","pos":"副","pronunciation":"パーシステントリー","ipa":"pərsístəntli","meaning":"粘り強く","booster":"per-(徹底的に)+sist(立つ、ラテン語sistere)。「最後までじっと立ち続ける」がイメージで「粘り強く、しつこく」の意味に。insist(主張する)、resist(抵抗する)と同じsist系の仲間。"},{"word":"adolescent","pos":"名","pronunciation":"アドレセント","ipa":"æ̀dəlésənt","meaning":"青年、思春期の若者","booster":"ラテン語adolescere(成長する)が語源。adult(大人)と同じ語根で、「成長しつつある人」つまり思春期の若者を指す。名詞adolescence(思春期)とセットで覚えたい。"},{"word":"quotient","pos":"名","pronunciation":"クォウシェント","ipa":"kwóuʃənt","meaning":"指数、商","booster":"ラテン語quotiens(いくつ、何倍)が語源。IQ(intelligence quotient)でおなじみの単語で、数学の「商(割り算の答え)」を意味する。quota(割り当て)とも同語源。"},{"word":"abstract","pos":"動","pronunciation":"アブストラクト","ipa":"æbstrǽkt","meaning":"抽象化する","booster":"abs-(離れて)+tract(引く、ラテン語trahere)。「具体的なものから引き離す」が原義で、細部を取り除き本質だけを取り出すイメージ。"},{"word":"synthesize","pos":"動","pronunciation":"シンセサイズ","ipa":"sínθəsàiz","meaning":"統合する、合成する","booster":"syn-(共に)+thesis(置くこと)。「複数の要素を一つに組み合わせて置く」が原義。シンセサイザー(synthesizer)は音を合成する楽器で、まさに同語源。"},{"word":"beneficial","pos":"形","pronunciation":"ベネフィシャル","ipa":"bènəfíʃəl","meaning":"有益な","booster":"bene-(良い)+fic(作る、ラテン語facere)。benefit(利益)の形容詞形で、「良い結果を作り出す」がコアイメージ。"},{"word":"by-product","pos":"名","pronunciation":"バイプロダクト","ipa":"báiprὰdʌkt","meaning":"副産物","booster":"by-(側にある、副次的な)+product(生産物)。主目的の過程で「ついでに生まれるもの」を指し、比喩的に「思わぬ副次的成果」の意味でも使われる。"},{"word":"breed","pos":"動","pronunciation":"ブリード","ipa":"brid","meaning":"生み出す、繁殖させる","booster":"本来は動物が「子を産み育てる」の意味だが、比喩的に「(状況などが)〜を生み出す」に拡張される。creativity breeds more creativityは「創造性が創造性を生む」好循環を表す。"},{"word":"eventually","pos":"副","pronunciation":"イヴェンチュアリー","ipa":"ivéntʃuəli","meaning":"最終的に、やがて","booster":"event(出来事)+ual+ly。「様々な出来事を経た結果として」というニュアンスで、紆余曲折の末にたどり着く結末を表す副詞。"},{"word":"potential","pos":"名","pronunciation":"ポテンシャル","ipa":"pəténʃəl","meaning":"可能性、潜在能力","booster":"ラテン語potentia(力)が語源で、power・possibleと同じ語根pot-を持つ。「まだ発揮されていない力」がそのまま「潜在能力」の意味になる。"},{"word":"convincing","pos":"形","pronunciation":"コンヴィンシング","ipa":"kənvínsiŋ","meaning":"説得力のある","booster":"convince(納得させる)の現在分詞。con-(完全に)+vincere(勝つ、征服する)が語源で、「相手の疑いに打ち勝つ」ほど説得力がある、というイメージ。"},{"word":"genius","pos":"名","pronunciation":"ジーニアス","ipa":"dʒínjəs","meaning":"天才、才能","booster":"ラテン語genius(守護霊、生まれ持った才能)が語源。generate(生み出す)やgene(遺伝子)と同じgen-(生まれる)ファミリーで、「生まれながらの特別な力」がコア。"},{"word":"pattern recognition","pos":"名","pronunciation":"パターン レコグニション","ipa":"pǽtərn rèkəgníʃən","meaning":"パターン認識","booster":"pattern(型)+recognition(認識)。"},{"word":"dimensional","pos":"形","pronunciation":"ディメンショナル","ipa":"dimménʃənəl","meaning":"次元の","booster":"dimension(次元)+-al。"},{"word":"modeling","pos":"名","pronunciation":"モデリング","ipa":"mάdəliŋ","meaning":"モデル化","booster":"model(模型)+-ing。"}]},{"number":7,"title":"「私たちは『ブランドのラベル』にお金を払っているのか!」","words":[{"word":"unsuspecting","ipa":"ʌ̀nsəspéktiŋ","pos":"形","pronunciation":"アンサスペクティング","meaning":"疑わない","booster":"sus-は「下から」、specは「見る」というラテン語の語根。suspect(疑う)は「下から覗き見る」が原義で、それにun-(否定)がついて「疑っていない」に。spectacle(見世物)やinspect(点検する)もspec仲間。"},{"word":"boast","ipa":"bóust","pos":"動","pronunciation":"ボウスト","meaning":"誇る","booster":"「胸を張って大声で言う」イメージの単語。boast about/of ~の形でよく使われ、単なるproudより「口に出して自慢する」ニュアンスが強い。"},{"word":"megacorporation","ipa":"mègəkɔ̀rpəréiʃən","pos":"名","pronunciation":"メガコーポレイション","meaning":"巨大企業","booster":"mega-(巨大)+corporation(会社)。corp-はラテン語で「体」を意味し、corpse(死体)やcorporal(身体の)と同語根。megabyte・megaphoneのmegaと合わせて「体(組織)が巨大化したもの」と覚える。"},{"word":"implication","ipa":"ìmplikéiʃən","pos":"名","pronunciation":"インプリケイション","meaning":"暗示","booster":"imply(暗示する)の名詞形。plic-はラテン語「折りたたむ」で、im-(中に)+plicで「言葉の中に折り込まれた意味」。complicate(複雑にする=一緒に折り込む)、explicit(はっきり広げた=明白な)も同じplic仲間。"},{"word":"detectable","ipa":"ditéktəbl","pos":"形","pronunciation":"ディテクタブル","meaning":"検知できる","booster":"detect(検知する)+able(できる)。tect-はラテン語tegere「覆う」で、de-(覆いを取る)+tect=「隠れていたものを暴く」。protect(前もって覆う=保護する)も同じtect語根。"},{"word":"exotic","ipa":"igzɑ́tik","pos":"形","pronunciation":"イグザティック","meaning":"異国風の","booster":"ギリシャ語exo-(外の)+-ic(形容詞化)。exit(出口)やexoskeleton(外骨格)と同じexo語根で「外からやってきた」が原義。転じて「異国風の、風変わりな」という意味に。"},{"word":"consumption","ipa":"kənsʌ́mpʃən","pos":"名","pronunciation":"コンサンプション","meaning":"消費","booster":"動詞consume(消費する)の名詞形。con-(完全に)+sumere(取る、ラテン語)で「すっかり取り込む」が原義。resume(再び取る=再開する)やassume(自分の方へ取る=想定する)も同じsume語根。"},{"word":"inferior","ipa":"infíriər","pos":"形","pronunciation":"インフィリア","meaning":"劣った","booster":"ラテン語inferus「下の」の比較級。inferno(地獄=一番下)と同語源で、「他より下にある」→「劣った」。反対語superior(sup-上+erior=優れた)とセットで覚えると効率的。"},{"word":"rival","ipa":"ráivəl","pos":"名","pronunciation":"ライバル","meaning":"競争相手","booster":"ラテン語rivus「川」が語源。同じ川(rivus)の水を取り合う者同士、というのが原義で「競争相手」に。river(川)と同語源というのは覚えやすい豆知識。"},{"word":"phenomenon","ipa":"fənɑ́mənɑ̀n","pos":"名","pronunciation":"フェノミナン","meaning":"現象","booster":"ギリシャ語phainein「現れる」が語源。phantom(幽霊)やphase(段階、現れ方)も同じ語根。「目に見える形で現れる出来事」が原義で「現象」に。複数形phenomenaも要チェック。"},{"word":"illusion","ipa":"ilúːʒən","pos":"名","pronunciation":"イリュージョン","meaning":"幻想","booster":"ラテン語il-(中で)+ludere(遊ぶ、からかう)が語源。「心の中で遊ばれるもの」=幻想。allude(ほのめかす)やelude(すり抜ける)も同じludere仲間。illustrate(照らし出す)とは別語源なので注意。"},{"word":"superior","ipa":"səpíriər","pos":"形","pronunciation":"スュペリア","meaning":"優れた","booster":"ラテン語super(上に)の比較級で「より上にある」が原義。本文のinferior(下にある→劣った)と対になる語で、seniorやexteriorなど-ior語尾の比較級グループに属す。"},{"word":"soar","ipa":"sɔ́r","pos":"動","pronunciation":"ソア","meaning":"急上昇する","booster":"元は「鳥が空高く舞い上がる」イメージの語。株価・数値・人気などが一気に跳ね上がる場合にも使われ、本文では消費量が急増する様子を表す。同音のsore(痛い)と混同しないこと。"},{"word":"unspoiled","ipa":"ʌnspóild","pos":"形","pronunciation":"アンスポイルド","meaning":"汚されていない、手つかずの","booster":"spoil(台無しにする)の過去分詞にun-(否定)がついた形。spoiled child(甘やかされた子)のspoilと同じ語で、「自然のままで損なわれていない」というイメージ。"},{"word":"distinguish","ipa":"distíŋgwiʃ","pos":"動","pronunciation":"ディスティングウィッシュ","meaning":"区別する","booster":"di-(離して)+stinguere(ラテン語「印をつける」)が語源で「印をつけて分ける」が原義。extinguish(火を消す=印を完全に消す)も同じstinguere仲間。"},{"word":"overlook","ipa":"òuvərlúk","pos":"動","pronunciation":"オウヴァルック","meaning":"見過ごす、大目に見る","booster":"over(上から)+look(見る)で「上から見下ろす」が原義。そこから「(細部を)見落とす」「(欠点を)大目に見る」の両方の意味に発展した多義語。"},{"word":"arena","ipa":"əríːnə","pos":"名","pronunciation":"アリーナ","meaning":"(活動の)舞台、領域","booster":"ラテン語harena「砂」が語源。古代ローマの闘技場の床に砂が敷かれていたことから「競技場」の意味になり、そこから比喩的に「(競争や議論の)舞台」を表すように。"},{"word":"generic","ipa":"dʒənérik","pos":"形","pronunciation":"ジェネリック","meaning":"一般的な、無銘柄の","booster":"gen-はラテン語で「種族、生まれ」を表す語根。genus(属)やgenerate(生み出す)と同語根で、「ある種族全体に共通する」→「特定の商標によらない一般的な」の意味に。ジェネリック医薬品のジェネリックと同じ。"},{"word":"mislead","ipa":"mìslíːd","pos":"動","pronunciation":"ミスリード","meaning":"誤解させる、惑わす","booster":"mis-(誤って)+lead(導く)で「誤った方向に導く」が原義。日本語でも「ミスリード」とカタカナで定着した語で、本文のmisleading advertising(誤解を招く広告)はこの現在分詞形。"},{"word":"fool","ipa":"fúːl","pos":"動","pronunciation":"フール","meaning":"だます","booster":"名詞fool(愚か者)がそのまま動詞化した語で「(人を)愚か者にする」→「だます」。fool around(ふざける)などのイディオムも頻出なので合わせて押さえておきたい。"},{"word":"qualitatively","pos":"副","pronunciation":"クオリタティヴリー","ipa":"kwάlətèitivli","meaning":"質的に","booster":"quality(質)+-tatively。quantitatively(量的に)の対義語。"},{"word":"composition","pos":"名","pronunciation":"コンポジション","ipa":"kὰmpəzíʃən","meaning":"組成、構成","booster":"compose(組み立てる、com-共に+ponere置く)+-ition。"},{"word":"object","pos":"動","pronunciation":"オブジェクト","ipa":"əbdʒékt","meaning":"異議を唱える","booster":"ob-(反対に)+jacere(投げる)。「反対に投げつける」が原義。名詞object(物体)とはアクセント位置が違う点に注意。"}]},{"number":8,"title":"地球に似た系外惑星「ケプラー186f」を発見","words":[{"word":"habitable","ipa":"hǽbitəbl","pos":"形","pronunciation":"ハビタブル","meaning":"生存可能な","booster":"ラテン語habitare「住む」が語源。habitat(生息地)、inhabit(〜に住む)と同じ仲間。「habitable zone=人が住める(生存可能な)領域」とセットで覚えると本文にも直結する。"},{"word":"constellation","ipa":"kɑ̀nstəléiʃən","pos":"名","pronunciation":"コンステレイション","meaning":"星座","booster":"con-(共に)+stella(星、ラテン語)で「星々が集まったもの」。stellar(星の、一流の)も同じstella語根を持つ。"},{"word":"composition","ipa":"kɑ̀mpəzíʃən","pos":"名","pronunciation":"コンポジション","meaning":"組成","booster":"com-(共に)+pos(置く、ラテン語ponere)で「一緒に置かれたもの」=構成・組成。compose(構成する、作曲する)、component(構成要素)も同じpos仲間。"},{"word":"exoplanet","ipa":"éksouplæ̀nit","pos":"名","pronunciation":"エクソプラネット","meaning":"系外惑星","booster":"exo-はギリシャ語で「外の」を意味する接頭辞。exoskeleton(外骨格)やexit(外へ出る)と同じ。exo+planetで文字通り「太陽系の外の惑星」。"},{"word":"rocky","ipa":"rɑ́ki","pos":"形","pronunciation":"ロッキー","meaning":"岩石質の","booster":"rock(岩)+y(形容詞化の語尾)。Rocky Mountains(ロッキー山脈)を思い浮かべれば、「岩だらけの」イメージがそのまま単語の意味になる。"},{"word":"astronomers","ipa":"əstrɑ́nəmərz","pos":"名","pronunciation":"アストロノマーズ","meaning":"天文学者","booster":"ギリシャ語astro-(星)+nomos(法則)で「星の法則を扱う人」=天文学者。astronaut(星への旅人=宇宙飛行士)も同じastro語根。"},{"word":"numerous","ipa":"núːmərəs","pos":"形","pronunciation":"ニューメラス","meaning":"多数の","booster":"ラテン語numerus「数」が語源。number(数)と同語源で「数が多い」。numeral(数字)、enumerate(一つ一つ数え上げる)も仲間。"},{"word":"companion","ipa":"kəmpǽnjən","pos":"名","pronunciation":"コンパニオン","meaning":"伴う仲間、伴星","booster":"ラテン語com-(共に)+panis(パン)が語源。「一緒にパンを食べる仲間」が原義で「相棒、伴う天体」に。company(会社、仲間)も同じ語根。"},{"word":"simultaneously","ipa":"sàiməltéiniəsli","pos":"副","pronunciation":"サイマルテイニアスリー","meaning":"同時に","booster":"ラテン語simul「同時に」が語源。simulate(同時に似せる=模倣する)、simultaneous(同時の)と同じ語根。複数の出来事が並行して起こるイメージで覚える。"},{"word":"atmospheric","ipa":"æ̀tməsfírik","pos":"形","pronunciation":"アトモスフェリック","meaning":"大気の","booster":"ギリシャ語atmos(蒸気)+sphaira(球)からatmosphere(大気圏)。その形容詞形がatmospheric。sphere(球体)やhemisphere(半球)も同じsphaira仲間。"},{"word":"quest","ipa":"kwést","pos":"名","pronunciation":"クエスト","meaning":"探求","booster":"ラテン語quaerere「探し求める」が語源。question(問い=探し求める行為)、request(再び求める=要求する)、conquest(完全に求め取る=征服)も同じ語根。"},{"word":"resides","ipa":"rizáidz","pos":"動","pronunciation":"リザイズ","meaning":"位置する、存在する","booster":"ラテン語re-(再び、後ろに)+sedere(座る)が語源。「その場に座り続ける」→「存在する、位置する」。resident(居住者)、sediment(沈殿物=座って落ち着いたもの)も仲間。"},{"word":"orbit","ipa":"ɔ́rbit","pos":"動","pronunciation":"オービット","meaning":"軌道を回る","booster":"ラテン語orbis「円、輪」が語源。「星の周りを円を描いて回る」がそのままの意味。名詞としても「軌道」の意味で使われ、orbital(軌道の)も同語根。"},{"word":"resemble","ipa":"rizémbl","pos":"動","pronunciation":"リゼンブル","meaning":"似ている","booster":"re-(再び)+semble(似せる、ラテン語simulare)が語源。名詞形resemblance(類似)とセットで覚える。simulate(模倣する)も同じsim語根の仲間。"},{"word":"dependent","ipa":"dipéndənt","pos":"形","pronunciation":"ディペンデント","meaning":"依存している","booster":"de-(下に)+pend(ぶら下がる、ラテン語pendere)が語源。「何かにぶら下がっている」→「それに頼っている」。depend(依存する)、pendulum(振り子)も同じpend仲間。"},{"word":"caution","ipa":"kɔ́ːʃən","pos":"動","pronunciation":"コーション","meaning":"警告する、注意を促す","booster":"ラテン語cavere「用心する」が語源。名詞として ","pronunciation":"ペシミスティック","ipa":"/ˌpesəˈmɪstɪk/","meaning":"悲観的な","booster":"ラテン語pessimus（最悪の）が語源。反対語optimisticはoptimus（最善の）から。pessimist（悲観論者）とセットで覚えると定着しやすい。"},{"word":"leakage","pos":"名","pronunciation":"リーケージ","ipa":"/ˈliːkɪdʒ/","meaning":"漏洩","booster":"leak（漏れる）に、行為・結果を表す名詞化接尾辞-ageがついた形。information leakage（情報漏洩）のように、水だけでなく情報が「漏れる」場合にも使われる。"},{"word":"disadvantage","pos":"名","pronunciation":"ディスアドバンテージ","ipa":"/ˌdɪsədˈvæntɪdʒ/","meaning":"不利益","booster":"advantage（利点）に否定のdis-がついただけの単純構造。テニスの「アドバンテージ」でおなじみのadvantageと対で覚えれば一瞬で入る。"},{"word":"entrant","pos":"名","pronunciation":"エントラント","ipa":"/ˈentrənt/","meaning":"参入者、新規参入企業","booster":"enter（入る）+antで「入る人・もの」。entrance（入り口）、entry（参入）と同語根で、market entrant（市場への新規参入者）のように使われる。"},{"word":"entrust","pos":"動","pronunciation":"エントラスト","ipa":"/ɪnˈtrʌst/","meaning":"委託する、任せる","booster":"en-（〜にする）+trust（信頼）という構造で、「信頼して任せる」イメージ。trustee（受託者）も同じtrust語根の仲間。"},{"word":"correlation","pos":"名","pronunciation":"コリレイション","ipa":"/ˌkɔːrəˈleɪʃən/","meaning":"相関関係","booster":"co-（共に）+relation（関係）で「相互に関係し合うこと」。統計用語correlation coefficient（相関係数）のように理系の文章にも頻出する語。"},{"word":"unduly","pos":"副","pronunciation":"アンデューリー","ipa":"/ʌnˈduːli/","meaning":"過度に、不当に","booster":"un-（否定）+duly（正当に、due「当然の」の副詞形）で「正当な程度を超えて」のイメージ。dueは「支払い期限が来た」の意味でもおなじみ。"},{"word":"lapse","pos":"名","pronunciation":"ラプス","ipa":"/læps/","meaning":"うっかりミス、（管理などの）ゆるみ","booster":"ラテン語labi（滑り落ちる）が語源。「気がゆるんで滑り落ちる」イメージから、小さな失敗や一時的な途絶えを指す。collapse（崩壊）も同じlab/laps語根。"},{"word":"undergo","pos":"動","pronunciation":"アンダーゴー","ipa":"/ˌʌndərˈɡoʊ/","meaning":"（検査・治療などを）受ける、経験する","booster":"under（下に）+go（行く）の組み合わせで、「試練の下をくぐり抜ける」イメージ。undergo an operation（手術を受ける）は頻出コロケーション。"},{"word":"accuracy","pos":"名","pronunciation":"アキュラシー","ipa":"/ˈækjərəsi/","meaning":"正確性","booster":"accurate（正確な）の名詞形。ラテン語ad-（〜へ）+cura（注意、curious「好奇心」と同語根）が語源で、「注意を払って仕上げた」精密さのイメージ。"},{"word":"diabetes","pos":"名","pronunciation":"ダイアビーティーズ","ipa":"/ˌdaɪəˈbiːtiːz/","meaning":"糖尿病","booster":"ギリシャ語diabainein（通り抜ける）が語源で、「水分が体を素通りしてしまう病気」というイメージから名づけられた。医療系の長文で頻出する病名の一つ。"},{"word":"venture","pos":"名","pronunciation":"ヴェンチャー","ipa":"/ˈventʃər/","meaning":"投機的事業、ベンチャー企業","booster":"adventure（冒険）から頭のadが落ちた語で、「危険を冒す事業」がもとの意味。venture capital（ベンチャーキャピタル）のように、新興企業への投資文脈で頻出。"},{"word":"halt","pos":"動","pronunciation":"ホルト","ipa":"/hɔːlt/","meaning":"停止させる、止まる","booster":"ドイツ語halten（保持する、止まる）に由来。come to a halt（停止する）のように名詞としても使われ、stopよりやや硬い響きを持つ。"},{"word":"solely","pos":"副","pronunciation":"ソウリー","ipa":"/ˈsoʊlli/","meaning":"もっぱら、単に","booster":"sole（唯一の、足の裏の意味もある）に副詞化の-lyがついた形。rely solely on〜（〜だけに頼る）のようにrely onとセットで覚えると使いやすい。"},{"word":"utmost","pos":"形","pronunciation":"アトモースト","ipa":"/ˈʌtmoʊst/","meaning":"最大限の、この上ない","booster":"out（外へ）の最上級的な古い形utmostで、「これ以上外へ出られない限界」のイメージ。with utmost care（細心の注意を払って）は定型表現。"},{"word":"acquired","pos":"形","pronunciation":"アクワイアード","ipa":"/əˈkwaɪərd/","meaning":"後天的な、習得した","booster":"acquire（獲得する＝ac-「〜へ」+quaerere「求める」）の過去分詞形。生まれつきのinnate/inbornと対で、「後から獲得した」性質を表す。"},{"word":"reliability","pos":"名","pronunciation":"リライアビリティ","ipa":"/rɪˌlaɪəˈbɪləti/","meaning":"信頼性","booster":"rely（頼る）+able（できる）+-ityで「頼ることができる度合い」。rely on〜（〜に頼る）の名詞派生と覚えれば、reliable（信頼できる）ともつながる。"},{"word":"examinee","pos":"名","pronunciation":"イグザミニー","ipa":"/ɪɡˌzæməˈniː/","meaning":"被験者、受験者","booster":"examine（検査する、試験する）に「〜される人」を表す接尾辞-eeがついた形。employ→employee（従業員）と同じ作りで、「調べられる側の人」を指す。"},{"word":"swab","pos":"名","pronunciation":"スワブ","ipa":"swάb","meaning":"綿棒","booster":"本来「船の甲板をこするモップ」の意味から、「拭き取り採取用の綿棒」に転じた。"},{"word":"saliva","pos":"名","pronunciation":"サライヴァ","ipa":"səláivə","meaning":"唾液","booster":"ラテン語saliva(唾)がそのまま語源。"},{"word":"clinical","pos":"形","pronunciation":"クリニカル","ipa":"klínikəl","meaning":"臨床の","booster":"clinic(診療所、ギリシャ語kline=寝台)+-al。"}]},{"number":11,"title":"高齢化社会のメリットとは？","words":[{"word":"demographic","pos":"形","pronunciation":"デモグラフィック","ipa":"/ˌdeməˈɡræfɪk/","meaning":"人口統計上の","booster":"ギリシャ語demos（民衆）+graphia（記述）が語源。democracy（民主主義＝demos+kratos「支配」）と同じdemos語根を持つ仲間。"},{"word":"fertility","pos":"名","pronunciation":"ファータリティ","ipa":"/fərˈtɪləti/","meaning":"出生率","booster":"ラテン語fertilis（実り豊かな）由来。形容詞fertile（土地が肥沃な／多産の）の名詞形で、「土地が実る」イメージが「子を産む」意味にも広がった。"},{"word":"compensate","pos":"動","pronunciation":"コンペンセイト","ipa":"/ˈkɑːmpənseɪt/","meaning":"埋め合わせる","booster":"ラテン語com-（共に）+pensare（秤にかける）が語源。「両方を天秤に乗せて釣り合わせる」イメージ。pension（年金）も同じpend/pens系（支払う）の親戚。"},{"word":"longevity","pos":"名","pronunciation":"ロンジェヴィティ","ipa":"/lɑːnˈdʒevəti/","meaning":"長寿","booster":"ラテン語longus（長い）+aevum（生涯・時代）から。longという見た目そのままに「長く生きること」と覚えれば忘れない。"},{"word":"workforce","pos":"名","pronunciation":"ワークフォース","ipa":"/ˈwɜːrkfɔːrs/","meaning":"労働力","booster":"work（仕事）+force（組織された人の集団）の複合語。air force（空軍）のforceと同じで、「働く人たちの集団」というイメージ。"},{"word":"consecutive","pos":"形","pronunciation":"コンセキュティブ","ipa":"/kənˈsekjətɪv/","meaning":"連続した","booster":"con-（共に）+sequi（続く、ラテン語）が語源。sequence（連続・順序）、subsequent（その後の）と同じsequ語根の仲間。"},{"word":"median","pos":"形","pronunciation":"ミーディアン","ipa":"/ˈmiːdiən/","meaning":"中央値の、中間の","booster":"ラテン語medius（真ん中の）由来。medium（中間・媒体）、mediate（仲裁する＝間に入る）と同じ語根で、「ちょうど真ん中」のイメージ。"},{"word":"gloomy","pos":"形","pronunciation":"グルーミー","ipa":"/ˈɡluːmi/","meaning":"陰鬱な、暗い","booster":"gloom（薄暗がり、憂鬱）の形容詞形。天候にも心情にも使え、a gloomy sky（どんよりした空）、a gloomy future（暗い未来）のように広く用いられる。"},{"word":"embrace","pos":"動","pronunciation":"エンブレイス","ipa":"/ɪmˈbreɪs/","meaning":"（考え方・状況を）受け入れる、抱きしめる","booster":"em-（〜の中に）+brace（腕、ラテン語bracchium）が語源で、文字通り「腕の中に抱え込む」。そこから比喩的に「進んで受け入れる」意味に発展した。"},{"word":"burden","pos":"名","pronunciation":"バードゥン","ipa":"/ˈbɜːrdn/","meaning":"負担、重荷","booster":"古英語byrthenが語源で「運ぶもの」の意。bear（運ぶ・耐える）と語感が近く、「背負って運ぶ重荷」のイメージで覚えると定着しやすい。"},{"word":"outperform","pos":"動","pronunciation":"アウトパフォーム","ipa":"/ˌaʊtpərˈfɔːrm/","meaning":"〜を上回る、〜より優れた成果を出す","booster":"out-（〜を超えて）+perform（成果を出す）の複合語。outdo, outnumber, outgrowなどout-系動詞は「他より優れる・上回る」という意味を作る便利な接頭辞。"},{"word":"destiny","pos":"名","pronunciation":"デスティニー","ipa":"/ˈdestəni/","meaning":"運命","booster":"ラテン語destinare（固定する、定める）が語源。「あらかじめ定められた道」のイメージで、destined to〜（〜する運命にある）という形でもよく使われる。"},{"word":"decline","pos":"動","pronunciation":"ディクライン","ipa":"/dɪˈklaɪn/","meaning":"減少する、衰退する","booster":"de-（下へ）+clinare（傾く、ラテン語）が語源で、「下方へ傾いていく」イメージ。名詞としても使われ、economic decline（経済の衰退）のように頻出する。"},{"word":"terminal","pos":"形","pronunciation":"ターミナル","ipa":"/ˈtɜːrmənl/","meaning":"末期の、最終的な","booster":"ラテン語terminus（境界、終点）が語源。空港のterminal（終着駅・発着所）と同じ語根で、「これ以上先がない終わりの地点」のイメージ。"},{"word":"symptom","pos":"名","pronunciation":"シンプトム","ipa":"/ˈsɪmptəm/","meaning":"症状、兆候","booster":"ギリシャ語syn-（共に）+piptein（落ちる）が語源で、「病気と一緒に現れ落ちてくるもの」のイメージ。医学的な症状だけでなく、社会問題の「兆候」の意味でも使われる。"},{"word":"lifespan","pos":"名","pronunciation":"ライフスパン","ipa":"/ˈlaɪfspæn/","meaning":"寿命","booster":"life（生命）+span（一続きの期間、橋のスパンと同じ語）の複合語。「生きている期間の長さ」をそのまま表す分かりやすい単語。"},{"word":"childlessness","pos":"名","pronunciation":"チャイルドレスネス","ipa":"/ˈtʃaɪldləsnəs/","meaning":"子供がいないこと","booster":"child（子供）に欠如を表す-less、さらに名詞化の-nessがついた形。careless（不注意な）と同じ-lessパターンで、「子を持たない状態」を表す。"},{"word":"proportion","pos":"名","pronunciation":"プロポーション","ipa":"/prəˈpɔːrʃən/","meaning":"割合、比率","booster":"pro-（〜に応じて）+portion（部分、割り当て）が語源。「全体に対する部分の釣り合い」がもとの意味で、in proportion to〜（〜に比例して）という形も頻出。"},{"word":"dependent","pos":"形","pronunciation":"ディペンデント","ipa":"/dɪˈpendənt/","meaning":"依存している","booster":"de-（下に）+pendere（ぶら下がる）が語源で、「何かにぶら下がって支えられている」イメージ。depend on〜（〜に頼る）の形容詞形で、independent（独立した）は反対語。"},{"word":"exception","pos":"名","pronunciation":"イクセプション","ipa":"/ɪkˈsepʃən/","meaning":"例外","booster":"ex-（外に）+capere（取る）が語源で、「全体の枠から外に取り出されたもの」のイメージ。exceptional（例外的な、傑出した）ともつながる。"},{"word":"statistician","pos":"名","pronunciation":"スタティスティシャン","ipa":"stæ̀tistíʃən","meaning":"統計学者","booster":"statistics(統計学)+-ian(専門家)。"},{"word":"relax","pos":"動","pronunciation":"リラックス","ipa":"rilǽks","meaning":"緩和する","booster":"re-(再び)+laxus(緩い、ラテン語)。本文では「規則を緩める」の意味で使われている(一般的な「くつろぐ」とは別の用法)。"}]},{"number":12,"title":"子どもが移民となる理由","words":[{"word":"phenomenon","pos":"名","pronunciation":"フェノミナン","ipa":"/fəˈnɑːmənɑːn/","meaning":"現象","booster":"ギリシャ語phainesthai（現れる）が語源。複数形はphenomenaという不規則変化で、datum→dataと同じくギリシャ・ラテン起源の単語に多いパターン。"},{"word":"unaccompanied","pos":"形","pronunciation":"アナカンパニード","ipa":"/ˌʌnəˈkʌmpənid/","meaning":"同伴者のいない","booster":"accompany（同行する＝ac-「〜へ」+company「仲間」）にun-（否定）がついた形。unaccompanied minor（保護者なしの未成年）は空港・移民関連の頻出表現。"},{"word":"internally displaced","pos":"形","pronunciation":"インターナリー・ディスプレイスト","ipa":"/ɪnˈtɜːrnəli dɪˈspleɪst/","meaning":"国内避難した","booster":"displace＝dis-（離れて）+place（場所）で「本来の場所から追い出す」。internally（国内で）と組み合わさり、国境は越えず住処だけ追われた人を指す難民関連の定型表現（IDP）。"},{"word":"reunification","pos":"名","pronunciation":"リーユニフィケーション","ipa":"/ˌriːjuːnəfɪˈkeɪʃən/","meaning":"再統合","booster":"re-（再び）+unify（uni「一つ」+-fy「〜化する」＝統一する）+-ation。family reunification（家族再統合）は移民政策で頻出のキーワード。"},{"word":"vulnerability","pos":"名","pronunciation":"ヴァルナラビリティ","ipa":"/ˌvʌlnərəˈbɪləti/","meaning":"脆弱性","booster":"ラテン語vulnus（傷）が語源で、vulnerable（傷つきやすい）の名詞形。同じvulnus由来のvulture（ハゲタカ＝傷ついた獲物を狙う鳥）と結びつけると忘れにくい。"},{"word":"subsequent","pos":"形","pronunciation":"サブシークウェント","ipa":"/ˈsʌbsɪkwənt/","meaning":"その後の、続く","booster":"sub-（下に）+sequi（続く）が語源で、「後に続いて起こる」イメージ。consequent（結果として起こる）、sequence（連続）と同じsequ語根の仲間。"},{"word":"custody","pos":"名","pronunciation":"カスタディ","ipa":"/ˈkʌstədi/","meaning":"保護、監護、拘留","booster":"ラテン語custodia（見張り、保管）由来。in custody（拘留中）、child custody（子の親権）のように、法律・家族関連の文脈で頻出する語。"},{"word":"typify","pos":"動","pronunciation":"ティピファイ","ipa":"/ˈtɪpəfaɪ/","meaning":"〜を代表する、〜の典型となる","booster":"type（型、タイプ）+-fy（〜化する）の組み合わせ。typical（典型的な）と同じtype語根で、「あるタイプの見本となる」イメージ。"},{"word":"prolonged","pos":"形","pronunciation":"プロロングド","ipa":"/prəˈlɔːŋd/","meaning":"長期化した、長引く","booster":"pro-（前へ）+long（長い）から成るprolongの過去分詞形。「時間を前へ前へと引き延ばす」イメージで、a prolonged illness（長患い）のように使う。"},{"word":"spur","pos":"動","pronunciation":"スパー","ipa":"/spɜːr/","meaning":"〜を駆り立てる、促進する","booster":"元は馬につける「拍車」を意味する名詞。そこから「拍車をかけて急がせる」という比喩で動詞化し、spur economic growth（経済成長を促す）のように使われる。"},{"word":"asylum","pos":"名","pronunciation":"アサイラム","ipa":"/əˈsaɪləm/","meaning":" iation":"バンクラプツィ","ipa":"bǽŋkrʌ̀ptsi","meaning":"破産","booster":"イタリア語banca rotta(壊れた台)が語源。支払い不能になった商人の作業台を壊した中世の風習に由来。"},{"word":"curriculum","pos":"名","pronunciation":"カリキュラム","ipa":"kəríkjuləm","meaning":"カリキュラム、教育課程","booster":"ラテン語currere(走る)が語源。「(学習が進む)走路」というイメージ。"},{"word":"inequality","pos":"名","pronunciation":"イニクワリティ","ipa":"ìnikwάləti","meaning":"不平等","booster":"in-(否定)+equality(平等)。"},{"word":"grasp","pos":"動","pronunciation":"グラスプ","ipa":"grǽsp","meaning":"理解する、把握する","booster":"本来は「つかむ」の意味。そこから「(概念を)しっかりつかむ」→「理解する」に転じた。"},{"word":"informed","pos":"形","pronunciation":"インフォームド","ipa":"infɔ́ːrmd","meaning":"十分な情報に基づいた","booster":"inform(知らせる)+-ed。informed decision(十分な情報に基づく意思決定)の形で頻出。"},{"word":"debt","pos":"名","pronunciation":"デット","ipa":"dét","meaning":"負債、借金","booster":"ラテン語debere(借りがある)が語源。"}]},{"number":30,"title":"都市部の混雑税","words":[{"word":"designated","pos":"形","pronunciation":"デズィグネイティド","ipa":"dézignèitid","meaning":"指定された","booster":"designate(指定する)+-ed。de-(はっきりと)+signare(印をつける、ラテン語)。"},{"word":"implement","pos":"動","pronunciation":"インプリメント","ipa":"ímpləmènt","meaning":"実施する","booster":"ラテン語implere(満たす)が語源。「道具を用いて仕事を満たし遂げる」イメージ。"},{"word":"reinvest","pos":"動","pronunciation":"リーインヴェスト","ipa":"rìːinvést","meaning":"再投資する","booster":"re-(再び)+invest(投資する)。"},{"word":"commerce","pos":"名","pronunciation":"カマース","ipa":"kάmərs","meaning":"商業","booster":"com-(共に)+merx(商品、ラテン語)。「商品を共にやり取りすること」。"},{"word":"lower-income","pos":"形","pronunciation":"ロウアー インカム","ipa":"lóuər ínkʌm","meaning":"低所得の","booster":"lower(より低い)+income(収入)。"},{"word":"offset","pos":"動","pronunciation":"オフセット","ipa":"ɔ́ːfsèt","meaning":"相殺する、埋め合わせる","booster":"off(離れて)+set(置く)。「一方に置いてバランスを取る」イメージ。"},{"word":"measure","pos":"名","pronunciation":"メジャー","ipa":"méʒər","meaning":"対策、方法","booster":"ラテン語mensura(測定)が語源。「(問題解決のために)測って講じる手立て」。"},{"word":"pollution","pos":"名","pronunciation":"ポリューション","ipa":"pəljúːʃən","meaning":"汚染","booster":"pollute(汚染する)+-ion(名詞化)。"}]}]/*END*/ }
  };
  SETS.polaris.name = '英語長文ポラリス 単語帳';
  SETS.eiken.name = '英検準1級ライティング特訓 単語帳';

  var DEFAULT_THRESHOLD = 5;
  var MIN_THRESHOLD = 1;
  var MAX_THRESHOLD = 10;
  var PROGRESS_KEY = 'vocab-test-progress-v1';
  var ACCOUNT_KEY = 'vocab-test-account';

  // ===== 進捗データ =====
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); } catch (e) { return {}; }
  }
  function saveProgress() {
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
    schedulePush();
  }
  var progress = loadProgress();

  function ensureSetProgress(setId) {
    if (!progress[setId]) {
      progress[setId] = { correctCounts: {}, currentRound: 0, roundHistory: [], threshold: DEFAULT_THRESHOLD };
    }
    var sp = progress[setId];
    if (!sp.correctCounts) sp.correctCounts = {};
    if (typeof sp.currentRound !== 'number') sp.currentRound = 0;
    if (!sp.roundHistory) sp.roundHistory = [];
    if (typeof sp.threshold !== 'number' || sp.threshold < MIN_THRESHOLD || sp.threshold > MAX_THRESHOLD) sp.threshold = DEFAULT_THRESHOLD;
    return sp;
  }
  // セットごとに「何回連続正解したら習得済み扱いにするか」を自由に設定できる（1〜10）。
  function getThreshold(setId) { return ensureSetProgress(setId).threshold; }
  function setThreshold(setId, n) {
    var sp = ensureSetProgress(setId);
    sp.threshold = Math.max(MIN_THRESHOLD, Math.min(MAX_THRESHOLD, n));
    saveProgress();
  }

  // ===== 単語一覧・キー =====
  function allWords(setId) {
    var set = SETS[setId];
    var out = [];
    set.lessons.forEach(function (lesson) {
      lesson.words.forEach(function (w, i) {
        out.push({ key: setId + ':' + lesson.number + ':' + i, lessonNumber: lesson.number, lessonTitle: lesson.title, w: w });
      });
    });
    return out;
  }
  function totalWords(setId) { return allWords(setId).length; }
  function masteredCount(setId) {
    var sp = ensureSetProgress(setId);
    var th = getThreshold(setId);
    var n = 0;
    for (var k in sp.correctCounts) { if (sp.correctCounts[k] >= th) n++; }
    return n;
  }

  // ===== リセット・手動習得 =====
  function resetSetProgress(setId) {
    var th = getThreshold(setId); // しきい値の設定は進捗リセットとは独立に保持する
    progress[setId] = { correctCounts: {}, currentRound: 0, roundHistory: [], threshold: th };
    saveProgress();
  }
  function resetLessonProgress(setId, lessonNumber) {
    var sp = ensureSetProgress(setId);
    allWords(setId).forEach(function (item) {
      if (item.lessonNumber === lessonNumber) delete sp.correctCounts[item.key];
    });
    saveProgress();
  }
  function markMastered(setId, key) {
    var sp = ensureSetProgress(setId);
    sp.correctCounts[key] = getThreshold(setId);
    saveProgress();
  }

  // ===== 出題プールの決定 =====
  // correctCounts は「連続正解回数」。不正解を挟むと0に戻る。
  // 各ラウンドの出題対象は「まだしきい値に達していない語」全部＝間違えた語ほど何度も出てくる、
  // 一度も間違えずしきい値まで正解できた語はプールから消える、という運用
  // （Fort様の紙の単語帳の回し方を再現。しきい値は1〜10でセットごとに自由に設定できる）。
  // lessonNumber を渡すと、そのレッスン/DAYの未習得語だけに絞り込む（レッスン単位テスト用）。
  function buildRoundQueue(setId, lessonNumber) {
    var sp = ensureSetProgress(setId);
    var th = getThreshold(setId);
    var words = allWords(setId);
    if (lessonNumber != null) {
      words = words.filter(function (item) { return item.lessonNumber === lessonNumber; });
    }
    return words.filter(function (item) { return (sp.correctCounts[item.key] || 0) < th; });
  }

  // ===== 画面状態 =====
  var route = { name: 'home' };
  var testState = null; // { setId, queue, idx, revealed, results: {key: bool} }
  var openLessonNumber = null; // renderSet内でアコーディオンを開いたまま再描画するための記憶

  function go(r) { route = r; render(); window.scrollTo(0, 0); }

  // ===== レンダリング =====
  var app = document.getElementById('app');

  function render() {
    app.innerHTML = '';
    if (route.name === 'account') renderAccountGate();
    else if (route.name === 'home') renderHome();
    else if (route.name === 'set') renderSet(route.setId);
    else if (route.name === 'test') renderTest();
    else if (route.name === 'result') renderResult();
  }

  function el(tag, cls, html) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (html !== undefined) d.innerHTML = html;
    return d;
  }

  function renderHome() {
    app.appendChild(syncCardEl());
    app.appendChild(el('div', 'eyebrow', 'VOCAB TEST'));
    app.appendChild(el('h1', null, '単語テスト'));

    ['polaris', 'eiken'].forEach(function (setId) {
      var total = totalWords(setId);
      var mastered = masteredCount(setId);
      var sp = ensureSetProgress(setId);
      var card = el('div', 'set-card');
      card.innerHTML =
        '<div class="set-name">' + esc(SETS[setId].name) + '</div>' +
        '<div class="set-meta">全' + total + '語 ・ ラウンド' + sp.currentRound + '</div>' +
        '<div class="set-progress-row">' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + (total ? Math.round(mastered / total * 100) : 0) + '%;"></div></div>' +
          '<div class="bar-num">' + mastered + ' / ' + total + '</div>' +
        '</div>';
      card.addEventListener('click', function () { go({ name: 'set', setId: setId }); });
      app.appendChild(card);
    });

    var foot = el('footer', null, '設定した回数だけ連続で正解した単語は「習得済み」としてもう出題されません（各セット詳細画面で1〜10回に変更可）。<br>不正解だった単語だけを次のラウンドで繰り返し出題します。');
    app.appendChild(foot);
  }

  function renderSet(setId) {
    var set = SETS[setId];
    var total = totalWords(setId);
    var mastered = masteredCount(setId);
    var sp = ensureSetProgress(setId);
    var th = getThreshold(setId);

    app.appendChild(syncCardEl());
    var back = el('a', 'back-link', '‹ 単語テストのホームへ');
    back.href = 'javascript:void(0)';
    back.addEventListener('click', function () { go({ name: 'home' }); });
    app.appendChild(back);

    app.appendChild(el('div', 'eyebrow', 'VOCAB TEST'));
    app.appendChild(el('h1', null, esc(set.name)));

    var statRow = el('div', 'stat-row');
    statRow.innerHTML =
      '<div class="stat-box"><div class="stat-num">' + mastered + '</div><div class="stat-label">習得済み</div></div>' +
      '<div class="stat-box"><div class="stat-num">' + (total - mastered) + '</div><div class="stat-label">未習得</div></div>' +
      '<div class="stat-box"><div class="stat-num">' + sp.currentRound + '</div><div class="stat-label">ラウンド</div></div>';
    app.appendChild(statRow);

    var thresholdRow = el('div', 'threshold-row');
    var thOptions = '';
    for (var ti = MIN_THRESHOLD; ti <= MAX_THRESHOLD; ti++) {
      thOptions += '<option value="' + ti + '"' + (ti === th ? ' selected' : '') + '>' + ti + '回</option>';
    }
    thresholdRow.innerHTML =
      '<label for="threshold-select">何回連続で正解したら習得済みにする？</label>' +
      '<select id="threshold-select" class="threshold-select">' + thOptions + '</select>';
    thresholdRow.querySelector('select').addEventListener('change', function (e) {
      setThreshold(setId, parseInt(e.target.value, 10));
      render();
    });
    app.appendChild(thresholdRow);

    var queue = buildRoundQueue(setId);
    var startBtn = el('button', 'primary-btn', mastered >= total
      ? '全語コンプリート！（お疲れ様でした）'
      : 'テストを始める（' + queue.length + '問・ラウンド' + (sp.currentRound + 1) + '）');
    startBtn.disabled = mastered >= total;
    startBtn.addEventListener('click', function () {
      testState = { setId: setId, queue: shuffle(queue.slice()), idx: 0, revealed: false, results: {} };
      go({ name: 'test' });
    });
    app.appendChild(startBtn);

    var resetSetRow = el('div', 'action-row');
    var resetSetBtn = el('button', 'secondary-btn danger-btn', 'このセットの進捗を全部リセット');
    resetSetBtn.addEventListener('click', function () {
      if (!window.confirm(set.name + 'の進捗（習得済み・ラウンド・記録）を全部リセットします。よろしいですか？')) return;
      resetSetProgress(setId);
      logAction('reset_set', { setId: setId });
      render();
    });
    resetSetRow.appendChild(resetSetBtn);
    app.appendChild(resetSetRow);

    if (sp.roundHistory.length) {
      var h2 = el('h2', null, 'これまでの記録');
      app.appendChild(h2);
      var histWrap = el('div', null);
      sp.roundHistory.slice().reverse().slice(0, 8).forEach(function (r) {
        var row = el('div', 'set-meta', 'ラウンド' + r.roundNum + '：' + r.correct + ' / ' + r.asked + ' 正解（新規習得 ' + r.newlyMastered + '語）');
        histWrap.appendChild(row);
      });
      app.appendChild(histWrap);
    }

    var h2b = el('h2', null, '単語一覧・成績');
    h2b.style.marginTop = '20px';
    app.appendChild(h2b);
    set.lessons.forEach(function (lesson) {
      var lessonMastered = 0;
      lesson.words.forEach(function (w, i) {
        var key = setId + ':' + lesson.number + ':' + i;
        if ((sp.correctCounts[key] || 0) >= th) lessonMastered++;
      });
      var acc = document.createElement('details');
      acc.className = 'word-acc';
      if (lesson.number === openLessonNumber) acc.open = true;
      acc.addEventListener('toggle', function () { openLessonNumber = acc.open ? lesson.number : null; });
      var summary = document.createElement('summary');
      summary.innerHTML = '<span>DAY/LESSON ' + lesson.number + ' ' + esc(lesson.title) + '</span><span class="lesson-progress">' + lessonMastered + ' / ' + lesson.words.length + '</span>';
      acc.appendChild(summary);
      var table = document.createElement('table');
      table.className = 'word-table';
      lesson.words.forEach(function (w, i) {
        var key = setId + ':' + lesson.number + ':' + i;
        var cnt = sp.correctCounts[key] || 0;
        var isMastered = cnt >= th;
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="wt-en">' + esc(w.word) + '</td>' +
          '<td>' + esc(w.meaning) + '</td>' +
          '<td class="wt-count">' + (isMastered ? '<span class="mastered-badge">習得済</span>' : ('連続' + cnt + '回')) + '</td>' +
          '<td class="wt-action"></td>';
        if (!isMastered) {
          var markBtn = el('button', 'mini-btn', '覚えた');
          markBtn.addEventListener('click', function () {
            openLessonNumber = lesson.number;
            markMastered(setId, key);
            render();
          });
          tr.querySelector('.wt-action').appendChild(markBtn);
        }
        table.appendChild(tr);
      });
      acc.appendChild(table);

      var lessonUnmastered = lesson.words.length - lessonMastered;
      var lessonBtnRow = el('div', 'lesson-acc-actions');
      var lessonBtn = el('button', 'secondary-btn', lessonUnmastered > 0
        ? 'このレッスンをテストする（' + lessonUnmastered + '問）'
        : 'このレッスンは全語習得済み');
      if (lessonUnmastered <= 0) lessonBtn.disabled = true;
      lessonBtn.addEventListener('click', function () {
        var lessonQueue = buildRoundQueue(setId, lesson.number);
        testState = { setId: setId, lessonNumber: lesson.number, queue: shuffle(lessonQueue.slice()), idx: 0, revealed: false, results: {} };
        go({ name: 'test' });
      });
      lessonBtnRow.appendChild(lessonBtn);

      var lessonResetBtn = el('button', 'secondary-btn danger-btn', 'このレッスンをリセット');
      lessonResetBtn.addEventListener('click', function () {
        if (!window.confirm('DAY/LESSON ' + lesson.number + ' の進捗をリセットします。よろしいですか？')) return;
        openLessonNumber = lesson.number;
        resetLessonProgress(setId, lesson.number);
        logAction('reset_lesson', { setId: setId, lessonNumber: lesson.number });
        render();
      });
      lessonBtnRow.appendChild(lessonResetBtn);
      acc.appendChild(lessonBtnRow);

      app.appendChild(acc);
    });
  }

  function currentWordItem() {
    return testState.queue[testState.idx];
  }

  function renderTest() {
    var item = currentWordItem();
    var total = testState.queue.length;
    var w = item.w;

    var card = el('div', 'test-card');
    var html = '<div class="test-progress">' + (testState.idx + 1) + ' / ' + total + '　DAY/LESSON ' + item.lessonNumber + '</div>';
    html += '<div class="test-word">' + esc(w.word) + '</div>';
    html += '<div><span class="test-pos">' + esc(w.pos) + '</span></div>';
    html += '<div class="test-ipa">[' + esc((w.ipa || '').replace(/^\/|\/$/g, '')) + ']</div>';
    if (w.pronunciation) html += '<div class="test-pron">' + esc(w.pronunciation) + '</div>';

    if (testState.revealed) {
      html += '<div class="test-answer">' +
        '<div class="test-meaning">' + esc(w.meaning) + '</div>' +
        '<div class="test-booster">' + esc(w.booster || '') + '</div>' +
      '</div>';
    }
    card.innerHTML = html;
    app.appendChild(card);

    if (!testState.revealed) {
      var revealBtn = el('button', 'primary-btn reveal-btn', '答えを見る');
      revealBtn.addEventListener('click', function () { testState.revealed = true; render(); });
      app.appendChild(revealBtn);
    } else {
      var judgeRow = el('div', 'judge-row');
      var ngBtn = el('button', 'judge-btn judge-ng', 'わからなかった');
      var okBtn = el('button', 'judge-btn judge-ok', 'わかった！');
      ngBtn.addEventListener('click', function () { judge(false); });
      okBtn.addEventListener('click', function () { judge(true); });
      judgeRow.appendChild(ngBtn);
      judgeRow.appendChild(okBtn);
      app.appendChild(judgeRow);
    }

    var skipRow = el('div', 'action-row');
    skipRow.style.marginTop = '10px';
    var skipBtn = el('button', 'mini-btn', 'もう知ってる（習得済みにする）');
    skipBtn.addEventListener('click', function () { skipMastered(); });
    skipRow.appendChild(skipBtn);
    app.appendChild(skipRow);

    var quitLink = el('a', 'back-link', '‹ 中断してホームへ（ここまでの回答は保存されません）');
    quitLink.style.marginTop = '18px';
    quitLink.href = 'javascript:void(0)';
    quitLink.addEventListener('click', function () { testState = null; go({ name: 'home' }); });
    app.appendChild(quitLink);
  }

  function judge(correct) {
    var item = currentWordItem();
    testState.results[item.key] = correct;
    testState.idx++;
    testState.revealed = false;
    if (testState.idx >= testState.queue.length) {
      finishRound();
    } else {
      render();
    }
  }

  // 「もう知ってる」：即座に習得済みにして次へ進む。judge()とは別ルートなので
  // finishRound()の集計（testState.results）には含めず、二重にcorrectCountsを
  // 更新しないようにする。
  function skipMastered() {
    var item = currentWordItem();
    markMastered(testState.setId, item.key);
    testState.idx++;
    testState.revealed = false;
    if (testState.idx >= testState.queue.length) {
      finishRound();
    } else {
      render();
    }
  }

  function finishRound() {
    var setId = testState.setId;
    var sp = ensureSetProgress(setId);
    var th = getThreshold(setId);
    var newlyMastered = 0, correctN = 0;
    for (var key in testState.results) {
      var ok = testState.results[key];
      if (ok) {
        correctN++;
        var before = sp.correctCounts[key] || 0;
        var after = before + 1;
        sp.correctCounts[key] = after;
        if (before < th && after >= th) newlyMastered++;
      } else {
        sp.correctCounts[key] = 0; // 不正解で連続正解カウントはリセット（次のラウンドでまた出題される）
      }
    }
    sp.currentRound++;
    sp.roundHistory.push({ roundNum: sp.currentRound, asked: testState.queue.length, correct: correctN, newlyMastered: newlyMastered, date: new Date().toISOString() });
    saveProgress();
    logAction('test_finish', { setId: setId, lessonNumber: testState.lessonNumber || null, asked: testState.queue.length, correct: correctN, newlyMastered: newlyMastered, roundNum: sp.currentRound });

    go({ name: 'result', setId: setId, asked: testState.queue.length, correct: correctN, newlyMastered: newlyMastered, roundNum: sp.currentRound });
    testState = null;
  }

  function renderResult() {
    var setId = route.setId;
    var total = totalWords(setId);
    var mastered = masteredCount(setId);

    var card = el('div', 'result-card');
    card.innerHTML =
      '<div class="result-title">ラウンド' + route.roundNum + ' 終了</div>' +
      '<div class="result-stats">' +
        '<div><div class="result-num">' + route.correct + ' / ' + route.asked + '</div><div class="result-label">今回の正解</div></div>' +
        '<div><div class="result-num">+' + route.newlyMastered + '</div><div class="result-label">新規習得</div></div>' +
      '</div>' +
      '<div class="set-meta">累計習得 ' + mastered + ' / ' + total + ' 語</div>';
    app.appendChild(card);

    var btn = el('button', 'primary-btn', 'このセットの画面へ戻る');
    btn.addEventListener('click', function () { go({ name: 'set', setId: setId }); });
    app.appendChild(btn);
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ===== Supabase 同期（アカウントベース、2026-09-01〜） =====
  // 旧・8桁コード手動共有方式は廃止。代わりにアカウント名（Fort_Dex/小山 等）を
  // sync_codeの代わりに使い、同じアカウントを選べばどの端末でも自動的に同じ進捗に
  // 同期される。writing_syncテーブルは他アプリ（today-task.html）と共用しているため、
  // sync_codeの値には 'vocab-test::' プレフィックスを付けて衝突を避けている。
  var SUPABASE_URL = 'https://bggwfdctijbdnihdfqhb.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_xqsFshtehk9nAkqaokOJhg_sGCLJaf9';
  var currentAccount = null;
  try { currentAccount = localStorage.getItem(ACCOUNT_KEY); } catch (e) {}
  var syncPushTimer = null;
  var lastSyncedAt = null;

  function accountSyncCode(name) { return 'vocab-test::' + name; }
  function supaHeaders(extra) {
    var h = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' };
    if (extra) { for (var k in extra) h[k] = extra[k]; }
    return h;
  }
  function syncPush() {
    if (!currentAccount || !window.fetch) return;
    fetch(SUPABASE_URL + '/rest/v1/writing_sync?on_conflict=sync_code', {
      method: 'POST',
      headers: supaHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({ sync_code: accountSyncCode(currentAccount), payload: { app: 'vocab-test', progress: progress } })
    }).then(function (r) { if (r.ok) { lastSyncedAt = new Date(); updateSyncUI(); } }).catch(function () {});
  }
  function schedulePush() {
    if (!currentAccount) return;
    if (syncPushTimer) clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(syncPush, 600);
  }
  function syncPull(name, cb) {
    if (!window.fetch) return cb(new Error('no fetch'));
    fetch(SUPABASE_URL + '/rest/v1/writing_sync?sync_code=eq.' + encodeURIComponent(accountSyncCode(name)) + '&select=payload', { headers: supaHeaders() })
      .then(function (r) { return r.json(); })
      .then(function (rows) { cb(null, rows && rows[0]); })
      .catch(function (e) { cb(e); });
  }

  // ===== アカウント一覧（vocab_test_accountsテーブル） =====
  var FALLBACK_ACCOUNTS = ['Fort_Dex', '小山']; // 通信できない場合の最低限のフォールバック
  function fetchAccountList(cb) {
    if (!window.fetch) return cb(FALLBACK_ACCOUNTS.slice());
    fetch(SUPABASE_URL + '/rest/v1/vocab_test_accounts?select=name&order=created_at.asc', { headers: supaHeaders() })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        var names = (rows || []).map(function (r) { return r.name; });
        cb(names.length ? names : FALLBACK_ACCOUNTS.slice());
      })
      .catch(function () { cb(FALLBACK_ACCOUNTS.slice()); });
  }
  function addAccount(name, cb) {
    if (!window.fetch) return cb(new Error('no fetch'));
    fetch(SUPABASE_URL + '/rest/v1/vocab_test_accounts?on_conflict=name', {
      method: 'POST',
      headers: supaHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({ name: name })
    }).then(function (r) { cb(r.ok ? null : new Error('failed')); }).catch(function (e) { cb(e); });
  }
  // Fort様だけが見る操作ログ（vocab_test_log、追記のみ）。失敗しても画面には影響させない。
  function logAction(action, detail) {
    if (!currentAccount || !window.fetch) return;
    fetch(SUPABASE_URL + '/rest/v1/vocab_test_log', {
      method: 'POST',
      headers: supaHeaders({ 'Prefer': 'return=minimal' }),
      body: JSON.stringify({ account_name: currentAccount, action: action, detail: detail || {} })
    }).catch(function () {});
  }

  function selectAccount(name) {
    currentAccount = name;
    try { localStorage.setItem(ACCOUNT_KEY, name); } catch (e) {}
    syncPull(name, function (err, row) {
      if (!err && row && row.payload && row.payload.progress) {
        progress = row.payload.progress;
        try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e2) {}
      }
      logAction('login', {});
      go({ name: 'home' });
    });
  }
  function switchAccount() {
    currentAccount = null;
    try { localStorage.removeItem(ACCOUNT_KEY); } catch (e) {}
    go({ name: 'account' });
  }

  function renderAccountGate() {
    var box = el('div', 'account-gate');
    box.appendChild(el('div', 'eyebrow', 'VOCAB TEST'));
    box.appendChild(el('h1', null, 'アカウントを選択'));
    box.appendChild(el('p', null, '選んだアカウントの進捗が、この端末を含めどこからでも同期されます。'));
    var list = el('div', 'account-list');
    box.appendChild(list);
    fetchAccountList(function (names) {
      list.innerHTML = '';
      names.forEach(function (name) {
        var item = el('button', 'account-item', esc(name));
        item.addEventListener('click', function () { selectAccount(name); });
        list.appendChild(item);
      });
    });
    var addRow = el('div', 'account-add-row');
    var input = document.createElement('input');
    input.placeholder = '新しい名前で追加';
    var addBtn = el('button', null, '追加');
    addBtn.addEventListener('click', function () {
      var name = (input.value || '').trim();
      if (!name) return;
      addBtn.disabled = true;
      addAccount(name, function (err) {
        addBtn.disabled = false;
        if (!err) selectAccount(name);
      });
    });
    addRow.appendChild(input);
    addRow.appendChild(addBtn);
    box.appendChild(addRow);
    app.appendChild(box);
  }

  function syncCardEl() {
    var box = el('div', 'sync-card');
    box.innerHTML =
      '<span><span class="sync-dot on"></span>アカウント: <b class="account-badge" style="font-family:var(--font-mono);">' + esc(currentAccount || '') + '</b></span>';
    var switchBtn = el('button', 'sync-btn', 'アカウント切替');
    switchBtn.addEventListener('click', switchAccount);
    box.appendChild(switchBtn);
    return box;
  }
  function updateSyncUI() { /* 現状の画面を再描画すれば十分反映される。頻繁な再描画は避け、必要時のみrender()側で対応 */ }

  function boot() {
    if (currentAccount) {
      syncPull(currentAccount, function (err, row) {
        if (!err && row && row.payload && row.payload.progress) {
          progress = row.payload.progress;
          try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
        }
        render();
      });
    } else {
      route = { name: 'account' };
      render();
    }
  }
  boot();
})();
</script>
